<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Digital Planner Support</title>
<style>
:root{
  --paper:#fbfaf7;
  --ink:#54525c;
  --muted:#89858a;
  --line:#e8e5df;
  --header:#56545e;
}
*{box-sizing:border-box}
html{background:#efefef}
body{
  margin:0;
  color:var(--ink);
  background:#efefef;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
}
.phone{
  width:min(100%, 480px);
  margin:0 auto;
  background:var(--paper);
  min-height:100vh;
  box-shadow:0 0 24px rgba(0,0,0,.08);
}
.topbar{
  background:var(--header);
  color:#fff;
  padding:17px 18px 16px;
  font-size:12px;
  font-weight:700;
  letter-spacing:.12em;
}
main{padding:39px 27px 46px}
h1{
  text-align:center;
  margin:0 0 34px;
  font-size:18px;
  font-weight:500;
  letter-spacing:.10em;
}
.block{margin-bottom:35px}
.block-title{
  font-size:13px;
  margin:0 0 19px;
  font-weight:500;
  letter-spacing:.02em;
}
.color-row{
  display:flex;
  align-items:center;
  gap:13px;
  min-height:44px;
  text-decoration:none;
  color:var(--ink);
}
.dot{
  width:30px;height:30px;border-radius:50%;
  flex:0 0 auto;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.025);
}
.code{
  font-size:13px;
  letter-spacing:.04em;
  color:#85818a;
}
.color-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  column-gap:24px;
  row-gap:19px;
}
.hint{
  margin-top:11px;
  font-size:10px;
  color:#aaa6aa;
  letter-spacing:.03em;
}
.tabs{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  border-bottom:1px solid var(--line);
  margin-bottom:17px;
}
.tab{
  text-align:center;
  font-size:11px;
  color:#969198;
  padding:0 2px 13px;
}
.tab:first-child{
  color:#67636b;
  border-bottom:1.5px solid #77727a;
}
.sticker-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}
.sticker-card{
  text-decoration:none;
  color:inherit;
  display:block;
}
.sticker-stage{
  height:116px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.sticker-stage img{
  max-width:100%;
  max-height:104px;
  object-fit:contain;
  filter:drop-shadow(0 4px 8px rgba(0,0,0,.035));
}
.save-label{
  text-align:center;
  color:#aaa6aa;
  font-size:9px;
  margin-top:5px;
  letter-spacing:.04em;
}
.all-download{
  display:block;
  text-decoration:none;
  text-align:center;
  color:#6e6971;
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px 14px;
  margin-top:25px;
  font-size:11px;
  background:#fffefa;
}
.footer-note{
  margin-top:14px;
  font-size:10px;
  line-height:1.7;
  color:#aaa6aa;
  text-align:center;
}
@media (max-width:360px){
  main{padding-left:20px;padding-right:20px}
  .color-grid{column-gap:14px}
  .code{font-size:12px}
  .sticker-stage{height:100px}
}
</style>
</head>
